<!DOCTYPE html>
<!-- The page of the app, created by Bio7 (WindowBuilder JavaScript) from the GUI
     class BoidsGlGui.java (/Bio7_Java_Examples/src/webgui). Change the GUI with the WindowBuilder and create the app
     again: this file is written again (the code of app.js and style.css stays). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boids in 3D (WebGL)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Boids in 3D (WebGL)</h1>
<div class="wb-grid" style="grid-template-columns: auto 1fr">
<div class="wb-cell"><label>Boids</label></div>
<div class="wb-cell"><span class="wb-slider"><input type="range" id="scaleBoids" min="50" max="800" step="50" value="300"><output id="scaleBoids_value" for="scaleBoids">300</output></span></div>
<div class="wb-cell"><label>Separation</label></div>
<div class="wb-cell"><span class="wb-slider"><input type="range" id="scaleSeparation" min="0" max="100" step="1" value="50"><output id="scaleSeparation_value" for="scaleSeparation">50</output></span></div>
<div class="wb-cell"><label>Alignment</label></div>
<div class="wb-cell"><span class="wb-slider"><input type="range" id="scaleAlignment" min="0" max="100" step="1" value="50"><output id="scaleAlignment_value" for="scaleAlignment">50</output></span></div>
<div class="wb-cell"><label>Cohesion</label></div>
<div class="wb-cell"><span class="wb-slider"><input type="range" id="scaleCohesion" min="0" max="100" step="1" value="30"><output id="scaleCohesion_value" for="scaleCohesion">30</output></span></div>
<div class="wb-cell"><label>Speed</label></div>
<div class="wb-cell"><span class="wb-slider"><input type="range" id="scaleSpeed" min="1" max="20" step="1" value="6"><output id="scaleSpeed_value" for="scaleSpeed">6</output></span></div>
<div class="wb-cell"><label><input type="checkbox" id="chkRotate" checked> Rotate the view</label></div>
<div class="wb-cell"><div id="cmpButtons">
<div class="wb-row">
<button type="button" id="btnStart">Start</button>
<button type="button" id="btnStop">Stop</button>
<button type="button" id="btnReset">Reset</button>
</div>
</div></div>
<div class="wb-cell" style="grid-column: span 2"><canvas id="glView" class="wb-webgl" width="700" height="500"></canvas></div>
<div class="wb-cell" style="grid-column: span 2"><span id="outStatus" class="wb-output">(the status)</span></div>
</div>
<script>
/* The values of the sliders, the tabs (part of the generated page) */
document.querySelectorAll("input[type=range]").forEach(r => {
  const o = document.getElementById(r.id + "_value");
  if (o) r.addEventListener("input", () => o.textContent = r.value);
});
document.querySelectorAll(".wb-tabs").forEach(t => {
  const bar = t.querySelectorAll(":scope > .wb-tabbar > button");
  const panels = t.querySelectorAll(":scope > .wb-tab");
  bar.forEach((b, i) => b.addEventListener("click", () => {
    bar.forEach((x, k) => x.classList.toggle("active", k === i));
    panels.forEach((p, k) => p.hidden = k !== i);
  }));
});
</script>
<script src="app.js"></script>
</body>
</html>
